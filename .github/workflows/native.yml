name: Native qualification

# Explicit trusted-operator run. Public pull requests never execute supplied
# native artifacts or run on a persistent self-hosted machine. The model fixture
# is exported on the disposable runner from the pinned official checkpoint.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-linux-amd64:
    name: Pinned linux/amd64 native gates
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: "1"
      ONNXRUNTIME_URL: https://github.com/microsoft/onnxruntime/releases/download/v1.29.0/onnxruntime-linux-x64-1.29.0.tgz
      TOKENIZERS_URL: https://github.com/daulet/tokenizers/releases/download/v1.27.0/libtokenizers.linux-amd64.tar.gz
    steps:
      - name: Check out committed sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Bundle provenance names the last exporter-source commit, not HEAD.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Node for installed-package qualification
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up pinned build-time exporter
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.10.4"
          enable-cache: false

      - name: Install runner audit tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ripgrep

      - name: Install Task and module dependencies
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.53.1
          modfile="$RUNNER_TEMP/laya-ci.mod"
          cp go.mod "$modfile"
          cp go.sum "${modfile%.mod}.sum"
          go mod download -modfile="$modfile" all
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Validate pinned native inputs and runner tools
        shell: bash
        run: |
          set -euo pipefail
          for name in ONNXRUNTIME_URL TOKENIZERS_URL; do
            url="${!name}"
            case "$url" in https://*) ;; *) echo "$name must be an HTTPS URL" >&2; exit 1;; esac
            case "$url" in *'@'*|*'?'*|*'#'*) echo "$name must contain no credentials or query tokens" >&2; exit 1;; esac
          done
          command -v nm
          command -v strings
          command -v sha256sum
          command -v jq
          test "$(git rev-parse --is-shallow-repository)" = false
          test "$(git log -1 --format=%H -- tools/export/src/laya_export tools/export/sdk_probe.py)" = b61873c061ae62e52f4e0a6dc6fdafb6ffe88a88

      - name: Acquire and verify pinned official export inputs
        shell: bash
        run: |
          set -euo pipefail
          artifact_root="$RUNNER_TEMP/laya-native-ci"
          source_dir="$artifact_root/source"
          sdk_archive="$artifact_root/sdk.tar.gz"
          sdk_dir="$artifact_root/laya-573e5b62696ba441230cd6be71d593331b5d23af"
          mkdir -m 700 "$artifact_root"
          mkdir -m 700 "$source_dir"
          while IFS=$'\t' read -r relative size digest; do
            case "$relative" in ''|/*|*'..'*|*'\'*) echo "invalid pinned source path" >&2; exit 1;; esac
            mkdir -p "$source_dir/$(dirname "$relative")"
            curl --fail --silent --show-error --location --retry 3 --proto '=https' --proto-redir '=https' \
              --output "$source_dir/$relative" \
              "https://huggingface.co/convaiinnovations/laya-multilingual/resolve/052592a15d198d9ad47da779604259b10b47b7aa/$relative"
            test "$(stat -c '%s' "$source_dir/$relative")" = "$size"
            echo "$digest  $source_dir/$relative" | sha256sum --check --status
            echo "Verified official source: $relative"
          done < <(jq -r '.source_files[] | [.path, (.size | tostring), .sha256] | @tsv' tools/export/profiles/laya-multilingual-v1.json)
          curl --fail --silent --show-error --location --retry 3 --proto '=https' --proto-redir '=https' \
            --output "$sdk_archive" \
            https://codeload.github.com/NandhaKishorM/laya/tar.gz/573e5b62696ba441230cd6be71d593331b5d23af
          echo "03931635a92b7609c6c253ac1d4d618ebe4fc54956744db01c027b504fd9c426  $sdk_archive" | sha256sum --check --status
          tar -xzf "$sdk_archive" -C "$artifact_root"
          echo "LAYA_SOURCE_DIR=$source_dir" >> "$GITHUB_ENV"
          echo "LAYA_SDK_DIR=$sdk_dir" >> "$GITHUB_ENV"
          echo "LAYA_BUNDLE_DIR=$artifact_root/bundle" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=1790035200" >> "$GITHUB_ENV"

      - name: Hydrate locked build-time exporter
        env:
          UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
          UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.cache/export-venv
          UV_PYTHON_DOWNLOADS: never
        run: uv sync --project tools/export --frozen

      - name: Assemble and verify disposable bundle offline
        shell: bash
        env:
          GOPROXY: "off"
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          ORT_DISABLE_TELEMETRY: "1"
          HTTP_PROXY: "http://127.0.0.1:1"
          HTTPS_PROXY: "http://127.0.0.1:1"
          ALL_PROXY: "http://127.0.0.1:1"
          NO_PROXY: ""
        run: |
          set -euo pipefail
          task bundle:export
          actual="$(go run ./internal/cmd/bundlecheck "$LAYA_BUNDLE_DIR")"
          jq -e --arg expected 'sha256:963bc035d885e0463ea1d7d54906cadf0e2a3a41073e131921800ea5cc358935' '.bundle_id == $expected' <<< "$actual"

      - name: Download and verify reviewed native inputs
        shell: bash
        run: |
          set -euo pipefail
          artifact_root="$RUNNER_TEMP/laya-native-ci"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --output "$artifact_root/onnxruntime.tgz" "$ONNXRUNTIME_URL"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --output "$artifact_root/tokenizers.tar.gz" "$TOKENIZERS_URL"
          echo "c3fddc4f139a045b0c4902c57410f0694f1c2fdf9b6939fbe38b1aeae7cd14ba  $artifact_root/onnxruntime.tgz" | sha256sum --check --status
          echo "72556cdca798dd4ea7cdaba308e5f0d68a8cb93b67c96edf485b7a0edd7b07f4  $artifact_root/tokenizers.tar.gz" | sha256sum --check --status
          tar -xzf "$artifact_root/onnxruntime.tgz" -C "$artifact_root" \
            onnxruntime-linux-x64-1.29.0/lib/libonnxruntime.so.1.29.0 \
            onnxruntime-linux-x64-1.29.0/LICENSE \
            onnxruntime-linux-x64-1.29.0/ThirdPartyNotices.txt
          tar -xzf "$artifact_root/tokenizers.tar.gz" -C "$artifact_root" libtokenizers.a
          echo "5715f06d8992ca8eeeddcce43df3a7d38f97d537052126f558e912cb312460ca  $artifact_root/onnxruntime-linux-x64-1.29.0/lib/libonnxruntime.so.1.29.0" | sha256sum --check --status
          echo "e6862b31745bb7d07980fcee70e49cd3b4318097609180f5d2d3fb394f305d50  $artifact_root/libtokenizers.a" | sha256sum --check --status
          mkdir -m 700 "$artifact_root/embed-work"
          echo "LAYA_ONNXRUNTIME_LIBRARY=$artifact_root/onnxruntime-linux-x64-1.29.0/lib/libonnxruntime.so.1.29.0" >> "$GITHUB_ENV"
          echo "LAYA_ONNXRUNTIME_DISTRIBUTION=$artifact_root/onnxruntime-linux-x64-1.29.0" >> "$GITHUB_ENV"
          echo "LAYA_TOKENIZERS_LIBRARY=$artifact_root/libtokenizers.a" >> "$GITHUB_ENV"
          echo "LAYA_EMBED_WORKDIR=$artifact_root/embed-work" >> "$GITHUB_ENV"

      - name: Run complete protected gates offline
        env:
          GOPROXY: "off"
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          ORT_DISABLE_TELEMETRY: "1"
          HTTP_PROXY: "http://127.0.0.1:1"
          HTTPS_PROXY: "http://127.0.0.1:1"
          ALL_PROXY: "http://127.0.0.1:1"
          NO_PROXY: ""
        run: |
          task setup:native
          task native:integration
          task source:integration
          task adk:integration
          task example:integration
          task bundle:materialize-embedded
          task test:embedded:race
          task qualification:gate
